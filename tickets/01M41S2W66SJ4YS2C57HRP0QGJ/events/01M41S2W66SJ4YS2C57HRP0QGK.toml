acceptance = ["Given a user-level COR_PROFILER variable, when the relay refresh task runs, then no code from it is loaded into the elevated process"]
body = 'The refresh task runs PowerShell with the highest privileges as the invoking user, so a same-account process that can set user-level environment variables (COR_ENABLE_PROFILING, COR_PROFILER, COMPlus_*) or HKCU\Software\Microsoft\Command Processor\AutoRun can get code into the elevated process. The script file, its paths and the system directory are already administrator-only or absolute. Fix direction: launch through a non-.NET stub that clears the variables, or replace the PowerShell script by a small signed helper; document the residual until then. Found in the NAT relay review.'
