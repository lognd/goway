acceptance = ["Given a helper whose WSL port is closed and whose Windows ssh answers with the distro Stopped, When goway doctor runs, Then it says the distro is stopped and prints the command that starts the keepalive", "Given a keepalive task with only a boot trigger, When goway doctor runs, Then it warns that a WSL shutdown leaves the helper offline and points at the fix", "Given an address that does not answer at all, When goway doctor runs, Then it says the machine is unreachable (not that WSL is stopped)", "Given the manual, When a reader opens the debugging section, Then it lists the by-hand checks: ping, port probe, wsl -l -v over Windows ssh, schtasks /query, and how to restart"]
body = "When the WSL ssh port does not answer but the same address answers Windows OpenSSH (or another configured Windows transport), doctor should look through Windows: wsl.exe -l -v (distro Stopped/Running), the keepalive task (present, last run, last result, has a repeating trigger), and the boot time; then print the exact fix (schtasks /run the keepalive, or goway-setup install to replace a boot-only task). The manual's debugging section gets the same steps written out by hand."
