title = "With no memory record, a cargo run starts at full parallelism and can OOM a small helper"
type = "bug"
category = "todo"
priority = "medium"
scope = ["crates/goway/src/fit.rs", "crates/goway/tests/**"]
acceptance = ["a cargo run with no recorded peak on a small helper starts with lowered jobs and says why", "once a record exists, the recorded estimate replaces the cold-start one"]
body = "Measured 2026-10-06 from frob-v2: after goway gc --repo cleared an inflated peak, the first cargo dev ci on a 3.8 GiB helper ran at full jobs and its linker was OOM-killed (clang Killed). fit::estimate returns None without a record, so Mode::Adaptive lowers nothing. Use a conservative cold-start estimate when nothing is recorded (for example a per-job default derived from host memory, or a fixed floor per job for Rust links) so the first run fits; real records then take over."
