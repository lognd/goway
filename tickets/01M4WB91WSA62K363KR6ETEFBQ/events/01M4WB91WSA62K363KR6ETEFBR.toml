kind = "create"
title = "goway-setup*.exe needs elevation to start at all: Windows installer detection triggers on 'setup'"
type = "bug"
category = "todo"
priority = "medium"
scope = ["crates/goway-setup/build.rs", "crates/goway-setup/Cargo.toml"]
acceptance = ["Every goway-setup exe embeds an application manifest with requestedExecutionLevel asInvoker", "goway-setup.exe install --host --dry-run runs unelevated under its release name, and the real install still elevates through its own prompt"]
body = 'Running goway-setup-arm64.exe install --host --dry-run from PowerShell (not elevated) failed with "The requested operation requires elevation" before goway ran. A renamed copy (gw-host-arm64.exe) ran fine and did its own UAC elevation later. Windows installer detection elevates unmanifested exes whose names contain "setup"/"install". build.rs embeds no manifest. Effects: --dry-run, status and the client install all demand admin, and interop launches from WSL fail outright.'
at = "2026-10-14T04:38:37Z"
