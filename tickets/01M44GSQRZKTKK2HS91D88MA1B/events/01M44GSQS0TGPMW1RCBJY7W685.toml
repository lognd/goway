acceptance = ["Given a boot or logon keepalive, When the task script is generated, Then its trigger repeats every few minutes with MultipleInstances IgnoreNew so a running keepalive is not duplicated", "Given a keepalive whose distro was shut down, When the next repetition fires, Then the distro is started again without user action (manual check documented in the done report)", "Given an existing install with the old boot-only task, When goway-setup install or tune runs again, Then the task is replaced with the repeating one"]
