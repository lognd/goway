body = '''Report from another session: 'goway host add nova --address 192.168.1.224 --port 22' fails with 'no Linux sshd answered ... key authentication refused' and suggests 'goway add' (passwd -S, faillock, fail2ban). docs/hosts.md says a Windows sshd is accepted as os=windows when no Linux machine answers, so this may be a bug when the key is not yet authorized. Asks: detect Windows sshd (banner or uname failure) and print Windows fixes (install OpenSSH.Server, authorize key in C:\ProgramData\ssh\administrators_authorized_keys with icacls, set DefaultShell to PowerShell); a print-commands mode (--windows / --no-password); let host add record a Windows ssh-only helper so it appears in host list. Overlaps circles phase 3 (Windows administrators_authorized_keys). Reproduce first.'''
