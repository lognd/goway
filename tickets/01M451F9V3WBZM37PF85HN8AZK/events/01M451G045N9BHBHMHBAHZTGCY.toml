old = "Found while landing the CI fixes: cargo nextest run --workspace inside a goway job on a 32-core helper reaches the 4096 task cap (ulimit -u fallback and TasksMax count threads): about 80 concurrent goway test clients show 32 tokio-rt-worker threads each, then fork and thread spawns fail with EAGAIN (45 to 190 failures, fork: retry: Resource temporarily unavailable). The client is I/O bound: bound its worker threads, or document the cap. Owner decision on the default job_tasks may be needed."
