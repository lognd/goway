kind = "create"
title = "install --host --distro defaults to 'Ubuntu' instead of the installed or default WSL distro"
type = "bug"
category = "todo"
priority = "medium"
scope = ["crates/goway-setup/src/host.rs", "crates/goway-setup/src/cli.rs"]
acceptance = ["With no --distro, goway-setup uses WSL's default distro, or the only installed one, when it is an Ubuntu/Debian distro", "When several candidates exist and none is the default, the error lists them and suggests --distro NAME instead of wsl --install"]
body = 'DEFAULT_DISTRO is the literal "Ubuntu" (crates/goway-setup/src/host.rs:22). On Nova the only distro is Ubuntu-22.04, so install --host stopped with NoDistro { installed: ["Ubuntu-22.04"] }. It then told the user to run `wsl --install -d Ubuntu` and restart, which installs a second distro they do not need. Only passing --distro Ubuntu-22.04 by hand worked.'
at = "2026-10-14T04:38:37Z"
actor = "lognd"
