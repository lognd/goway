acceptance = ['Given a command whose program differs by OS, when it runs on a host of another OS, then only the program (argv[0]) is translated, never other arguments: python3 or python to the py -3 launcher (else python.exe; never the WindowsApps Store stub) on Windows and to python3 on a Linux host without python; pip3 or pip to py -3 -m pip; ./gradlew to gradlew.bat; ./mvnw to mvnw.cmd; a ./relative/path program to .\relative\path with .exe appended when that file exists (and the multi-config build\Debug or build\Release location when only that exists); node, npm, npx, cargo, go and dotnet unchanged', "Given a translation, when the run starts, then goway prints one line naming host and translation (for example nova-windows: python3 -> py -3), and the --report records the requested and the actual program", 'Given [translate] entries in goway.toml (for example mytool = { windows = "mytool.cmd", linux = "mytool" }), when goway translates, then project entries take precedence over built-in ones, and an unknown OS key is a config error naming file and line', "Given a command goway can translate, when cross-OS rules apply (~EDPP8DN), then it counts as cross-platform (the same-OS default, the loud hint, --any-os, cross_os and --each-os all apply to it)"]
