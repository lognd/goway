scope = ["crates/goway/src/uninstall.rs"]
acceptance = ["Given active change records for helpers, When goway uninstall runs without --everywhere, Then it keeps those records (or refuses), names each helper with active changes and the command that undoes them (goway uninstall --everywhere, or per host)", "Given goway uninstall --everywhere, When it runs, Then each helper's changes are undone first and its record is deleted only after its undo succeeded"]
body = "goway uninstall --dry-run (without --everywhere) on a machine with helpers lists 'delete' for ~/.config/goway/installed-HOST.json, fixes-HOST.json and ssh-setup-HOST.json, the records goway needs to undo what it changed on each helper (installs, doctor fixes, authorized_keys). Deleting them without undoing the changes orphans those changes: they can no longer be listed or reverted, which breaks the journaling invariant (docs/changes.md)."
