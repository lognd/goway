acceptance = ["Given a recognized cross-platform command (cargo build/test/nextest/clippy, pytest or python -m pytest, go test, npm/pnpm/yarn test, npx vitest/jest, mvn, gradle or gradlew, dotnet test, ctest) and hosts of another OS in the fleet, when goway run picks hosts with no --any-os and no cross_os setting, then it stays on the laptop's OS and prints a prominent warning (its own block, not a one-line note) naming the other-OS hosts that could take it and the two ways to allow it: --any-os for this run, or cross_os = true in the project's goway.toml; cross_os = false silences the warning for that project", "Given --any-os or cross_os = true, when goway picks hosts or shards, then hosts of every OS are candidates (each OS keeps its own caches), and the report and the per-shard lines name each shard's OS", "Given goway run --each-os -- CMD, when it runs, then CMD runs once on one host of each OS in the fleet in parallel, output lines carry [host os] prefixes, a summary lists each OS's exit code, and goway exits non-zero if any OS failed (the first failing exit code, or 125 if goway itself failed)", "Given an unrecognized command (bash -c, a script, an arbitrary program), when it is run, then no warning is printed and it stays same-OS unless --any-os or --each-os asks otherwise"]
