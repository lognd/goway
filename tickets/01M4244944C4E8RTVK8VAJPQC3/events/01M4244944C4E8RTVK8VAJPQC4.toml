acceptance = ["Given a probe, when it runs, then goway measures the helper's clock offset from the laptop (helper epoch time against the laptop's, corrected by half the round trip), goway status shows offsets over 2 seconds, and goway doctor warns with the fix (WSL after sleep: wsl --shutdown or sudo hwclock -s; Windows: resync time)", "Given a run that has just created its work directory, when the helper's wall clock jumps forward by any amount, then gc never removes it: a fresh work directory is protected by a liveness check (its creator process is alive on that helper), not only by its age; a test simulates the jump", "Given synced files whose mtimes are in the helper's future (the laptop clock runs ahead), when the slot is reconciled, then their slot copies are clamped to the helper's current time so make and ninja neither warn about clock skew nor rebuild on every run, tar's future-timestamp warnings are suppressed, and a test with mtimes one hour ahead proves the second run rebuilds nothing", "Given docs/design.md, when read, then it states that goway stores only epoch seconds (timezones never matter), which clock each comparison uses (laptop or helper), and why no comparison mixes the two"]
