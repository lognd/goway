new = ["Given a helper whose Windows user was active within the idle window (default 5 minutes) or which runs on battery, when goway picks hosts, then the helper is never skipped for that reason; an idle helper on mains power is preferred when the choice is otherwise close (a scoring penalty, not an exclusion)", "Given a run that lands on a helper in use, when the job starts, then it runs extra nicely: nice 19 and idle I/O class (instead of the default nice 10), and at most half the helper's cores for build parallelism (CARGO_BUILD_JOBS, MAKEFLAGS -j, CMAKE_BUILD_PARALLEL_LEVEL, NEXTEST_TEST_THREADS) unless the user set them; goway says so in one line", "Given a helper where activity or power cannot be read (interop disabled, macOS without the tool, a probe timeout), when goway decides, then it treats the state as unknown, which neither blocks nor penalises, and status shows it"]
