new = ["Given other ecosystems, when doctor determines needs, then it uses each tool's machine-readable output where it exists (cargo metadata, go list -m -json and go env -json, mvn help:effective-pom, Gradle's toolchain report, dotnet --list-sdks) and real parsers (TOML, JSON, XML) for declarative files; plain text matching is only a fallback when the tool is missing, and doctor labels such results approximate and says to install the tool first", """Given a Rust project whose .cargo/config.toml (or a parent's, or CARGO_* env) names a linker or link-arg such as linker = "clang" with -fuse-ld=mold or lld, for the helper's target triple, when doctor runs, then it checks that linker and that ld backend on every helper (cargo config get, or a TOML parse of every config.toml cargo would read), reports a missing one as an error with the fix (system package through --rsudo: clang, mold, lld), and names the one-run override (CARGO_TARGET_<TRIPLE>_LINKER and _RUSTFLAGS via goway run --env) without ever applying it silently; found live on 2026-10-03: frob-v2 needs clang and mold, and neither helper has them"""]
