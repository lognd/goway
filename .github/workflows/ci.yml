# Checks every push and pull request: format, lints, the whole test suite on
# Linux, that goway builds and its client tests and install scripts pass on
# macOS, that the Windows crates build and pass their tests on Windows, that
# packaging for crates.io works, and that the PyPI wheel builds and runs.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: PowerShell is installed, so the remote.ps1 contract tests really run
        run: pwsh --version
      - run: cargo nextest run --workspace --locked
      - name: Real GoogleTest v1.15.2 and Catch2 v3.7.1 binaries are detected and sharded
        run: cargo nextest run -p goway --locked --run-ignored only -E 'test(real_googletest_and_catch2_binaries_are_detected_and_sharded_disjointly)'
      - name: Packaging dry run (goway-setup is publish = false and skipped)
        run: cargo publish --workspace --dry-run --exclude goway-setup --locked
  wheel:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          manylinux: auto
          args: --release --locked --out dist
      - name: The wheel installs into a clean venv and goway --version runs
        run: |
          python3 -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          /tmp/wheel-venv/bin/goway --version
      - uses: astral-sh/setup-uv@v7
      - name: uv tool install of the wheel, then goway uninstall --yes removes everything
        run: |
          set -eu
          root="$(mktemp -d)"
          export HOME="$root/home"
          export XDG_DATA_HOME="$root/home/.local/share"
          export XDG_CONFIG_HOME="$root/home/.config"
          export XDG_STATE_HOME="$root/home/.local/state"
          export UV_TOOL_BIN_DIR="$HOME/.local/bin"
          mkdir -p "$HOME" "$XDG_CONFIG_HOME/goway"
          # the wheel installs as a uv tool; its environment lands under XDG_DATA_HOME
          uv tool install dist/*.whl
          export PATH="$UV_TOOL_BIN_DIR:$PATH"
          goway --version
          test -d "$XDG_DATA_HOME/uv/tools/goway"
          : > "$XDG_CONFIG_HOME/goway/config.toml"
          goway uninstall --yes
          test ! -e "$XDG_DATA_HOME/uv/tools/goway"
          test ! -e "$UV_TOOL_BIN_DIR/goway"
          test ! -e "$XDG_CONFIG_HOME/goway/config.toml"
          echo "goway, its settings and its uv tool environment are gone"
  windows:
    timeout-minutes: 45
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo clippy -p goway -p goway-setup -p goway-journal --all-targets --locked -- -D warnings
      - run: cargo test -p goway-setup -p goway-journal --locked --no-fail-fast
      - name: The remote.ps1 contract tests under PowerShell 7 (pwsh)
        run: |
          pwsh --version
          cargo test -p goway --test remote_ps1 --locked
      - name: The same tests under Windows PowerShell 5.1
        env:
          GOWAY_PWSH: powershell
        run: cargo test -p goway --test remote_ps1 --locked
  macos:
    # The client, the install scripts and goway's remote script on macOS
    # (bash 3.2, BSD userland; the remote script runs on Homebrew's GNU tools).
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: GNU tools the remote script needs (what goway doctor --fix installs)
        run: brew install coreutils findutils gnu-sed gnu-tar grep util-linux flock
      - name: Tests (the test scripts assume GNU userland tools first on PATH)
        run: |
          for d in coreutils findutils gnu-sed gnu-tar grep; do
            PATH="/opt/homebrew/opt/$d/libexec/gnubin:$PATH"
          done
          export PATH
          scripts/ci-ps-watch.sh &
          watcher=$!
          trap 'kill $watcher 2>/dev/null' EXIT
          # remote_ps1 needs PowerShell, which a Mac does not have.
          # No retries: a hang or a flake here is a bug (see docs/macos.md).
          cargo nextest run -p goway --locked --no-fail-fast -E 'not binary(remote_ps1)'
      - name: The tests that start many helper calls at once, repeated (the spawn race)
        run: |
          for d in coreutils findutils gnu-sed gnu-tar grep; do
            PATH="/opt/homebrew/opt/$d/libexec/gnubin:$PATH"
          done
          export PATH
          scripts/ci-ps-watch.sh &
          watcher=$!
          trap 'kill $watcher 2>/dev/null' EXIT
          cargo nextest run -p goway --locked --no-fail-fast --stress-count 6 -E 'binary(slot_trees) | binary(nesting) | binary(copy_integrity) | test(spawn::)'
