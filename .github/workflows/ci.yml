# Checks every push and pull request: format, lints, the whole test suite on
# Linux, that goway builds and its client tests and install scripts pass on
# macOS, that the Windows crates build and pass their tests on Windows, that
# packaging for crates.io works, and that the PyPI wheel builds and runs.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo nextest run --workspace --locked
      - name: Packaging dry run (goway-setup is publish = false and skipped)
        run: cargo publish --workspace --dry-run --exclude goway-setup --locked
  wheel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          manylinux: auto
          args: --release --locked --out dist
      - name: The wheel installs into a clean venv and goway --version runs
        run: |
          python3 -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          /tmp/wheel-venv/bin/goway --version
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo clippy -p goway -p goway-setup -p goway-journal --all-targets --locked -- -D warnings
      - run: cargo test -p goway-setup -p goway-journal --locked --no-fail-fast
  macos:
    # The client and the install scripts on macOS (bash 3.2, BSD userland).
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run -p goway --lib --test install_scripts --locked
