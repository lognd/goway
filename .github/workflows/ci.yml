# Checks every push and pull request: format, lints, the whole test suite on
# Linux, and that the Windows crates build and pass their tests on Windows.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo nextest run --workspace --locked
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo clippy -p goway -p goway-setup -p goway-journal --all-targets --locked -- -D warnings
      - run: cargo test -p goway-setup -p goway-journal --locked --no-fail-fast
