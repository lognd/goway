name: mac-probe
on:
  push:
    branches: ['ci/**']
jobs:
  probe:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - run: brew install coreutils findutils gnu-sed gnu-tar grep util-linux flock cargo-nextest >/dev/null 2>&1
      - run: |
          for d in coreutils findutils gnu-sed gnu-tar grep; do PATH="/opt/homebrew/opt/$d/libexec/gnubin:$PATH"; done
          export PATH
          GOWAY_XTRACE=1 cargo test -p goway --test slot_trees make_rebuilds_when -- --nocapture 2>&1 | grep -v "^   Compiling\|^warning" | tail -150 | cut -c1-260
