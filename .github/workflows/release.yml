# Builds the release on a version tag (vX.Y.Z): static Linux binaries for
# x86_64 and aarch64, goway-setup.exe for x64 and ARM64 Windows (each with
# goway.exe embedded), SHA256SUMS, install.sh, and build provenance
# attestations, then publishes them as a GitHub release, and then to
# crates.io and PyPI (maturin wheels and an sdist; macOS wheels are left out
# until goway is supported there).
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  linux:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked -p goway --target ${{ matrix.target }}
      - run: tar -czf goway-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release goway
      - uses: actions/upload-artifact@v4
        with:
          name: goway-${{ matrix.target }}
          path: goway-${{ matrix.target }}.tar.gz
  windows:
    strategy:
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            asset: goway-setup.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: goway-setup-arm64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked -p goway --target ${{ matrix.target }}
      - name: Build the installer with goway.exe embedded
        shell: bash
        run: |
          GOWAY_PAYLOAD="$PWD/target/${{ matrix.target }}/release/goway.exe" \
            cargo build --release --locked -p goway-setup --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/goway-setup.exe ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
  wheels:
    strategy:
      matrix:
        include:
          # manylinux wheels install on glibc systems (the common case);
          # musllinux wheels carry the static musl binary for Alpine and
          # friends. A musllinux wheel is rejected by pip on glibc systems,
          # so both families are published.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: auto
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: auto
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            manylinux: "off"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-wheel-${{ matrix.target }}
          path: dist
  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-sdist
          path: dist
  publish:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          # Only the GitHub release assets; the PyPI artifacts are pypi-*.
          pattern: goway*
          merge-multiple: true
      - name: Checksums and installer script
        run: |
          cp scripts/install.sh dist/install.sh
          cd dist && sha256sum goway-*.tar.gz goway-setup*.exe install.sh > SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "goway ${GITHUB_REF_NAME}" --generate-notes
  crates-io:
    needs: [publish]
    runs-on: ubuntu-24.04
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Publish goway-journal, then goway (goway-setup is publish = false)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace --exclude goway-setup --locked
  pypi:
    needs: [publish, wheels, sdist]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: pypi-*
          merge-multiple: true
      # PyPI trusted publishing (OIDC): no token is stored anywhere.
      - uses: pypa/gh-action-pypi-publish@release/v1
