# Builds the release on a version tag (goway-vX.Y.Z): static Linux binaries for
# x86_64 and aarch64, macOS binaries for Apple Silicon and Intel, goway-setup.exe for x64 and ARM64 Windows (each with
# goway.exe embedded), SHA256SUMS, install.sh, and build provenance
# attestations, then publishes them as a GitHub release, and then to
# crates.io and PyPI (maturin wheels for Linux, macOS and Windows, and an
# sdist). The macOS binaries are goway only (the client); the macOS helper
# side is not supported.
#
# A workflow_dispatch run is a dry run: it builds everything and uploads the
# files as workflow artifacts, and the three publishing jobs (publish,
# crates-io, pypi) are skipped. They run only on a goway-v* tag push, after
# the version-tag job confirms the tag matches the Cargo version. The
# crates-io and pypi environments only accept goway-v* tags.
name: release
on:
  push:
    tags: ["goway-v*"]
  # Dry run: builds and uploads every artifact, publishes nothing.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked -p goway --target ${{ matrix.target }}
      - run: tar -czf goway-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release goway
      - uses: actions/upload-artifact@v7
        with:
          name: goway-${{ matrix.target }}
          path: goway-${{ matrix.target }}.tar.gz
  macos:
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked -p goway --target ${{ matrix.target }}
      - run: tar -czf goway-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release goway
      - uses: actions/upload-artifact@v7
        with:
          name: goway-${{ matrix.target }}
          path: goway-${{ matrix.target }}.tar.gz
  windows:
    strategy:
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            arch: x64
            asset: goway-setup.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            arch: arm64
            asset: goway-setup-arm64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Build goway.exe and the installer with goway.exe embedded
        shell: bash
        run: |
          bash scripts/windows/build.sh --arch ${{ matrix.arch }}
          cp dist/${{ matrix.asset }} ${{ matrix.asset }}
      - name: The binaries are for this CPU and run natively
        shell: pwsh
        run: |
          $want = '${{ matrix.arch }}'
          foreach ($f in 'target/${{ matrix.target }}/release/goway.exe', '${{ matrix.asset }}') {
            $got = scripts/windows/pe-machine.ps1 $f
            if ($got -ne $want) { throw "$f is $got, expected $want" }
          }
          # windows-11-arm runs the arm64 files without emulation; windows-2025 runs the x64 ones.
          & 'target/${{ matrix.target }}/release/goway.exe' --version
          if ($LASTEXITCODE -ne 0) { throw "goway.exe --version failed" }
          & './${{ matrix.asset }}' --version
          if ($LASTEXITCODE -ne 0) { throw "${{ matrix.asset }} --version failed" }
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
  wheels:
    strategy:
      matrix:
        include:
          # manylinux wheels install on glibc systems (the common case);
          # musllinux wheels carry the static musl binary for Alpine and
          # friends. A musllinux wheel is rejected by pip on glibc systems,
          # so both families are published.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: auto
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: auto
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            manylinux: "off"
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            manylinux: "off"
          - os: macos-14
            target: aarch64-apple-darwin
            manylinux: "off"
          - os: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: "off"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: pypi-wheel-${{ matrix.target }}
          path: dist
  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: pypi-sdist
          path: dist
  checksums:
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          # Only the GitHub release assets; the PyPI artifacts are pypi-*.
          pattern: goway*
          merge-multiple: true
      - name: Checksums and installer script
        run: |
          cp scripts/install.sh dist/install.sh
          cd dist && sha256sum goway-*.tar.gz goway-setup*.exe install.sh > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist
  version-tag:
    # The tag goway-vX.Y.Z must name the workspace version, so a mistyped tag
    # publishes nothing.
    if: startsWith(github.ref, 'refs/tags/goway-v') && github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: The tag matches the Cargo version
        run: |
          tag="${GITHUB_REF_NAME#goway-v}"
          cargo_version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$tag" != "$cargo_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} names ${tag}, but Cargo.toml says ${cargo_version}"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches Cargo version ${cargo_version}"
  publish:
    needs: [checksums, version-tag]
    if: startsWith(github.ref, 'refs/tags/goway-v') && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "goway ${GITHUB_REF_NAME#goway-v}" --generate-notes
  crates-io:
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/goway-v') && github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: crates-io
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Publish goway-journal, then goway (goway-setup is publish = false)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace --exclude goway-setup --locked
  pypi:
    needs: [publish, wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/goway-v') && github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: pypi-*
          merge-multiple: true
      # PyPI trusted publishing (OIDC): no token is stored anywhere.
      - uses: pypa/gh-action-pypi-publish@release/v1
