[package]
name = "goway"
description = "Run a command on the least-loaded machine of a pool, natively, from the current git work tree."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
anstream = "0.6"
anstyle = "1"
base64 = "0.22"
dirs = "6"
goway-journal = { path = "../goway-journal" }
humantime = "2"
humantime-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
ctrlc = "3"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
thiserror = "2"
toml = "0.9"
toml_edit = { version = "0.23", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
serde_json = "1"
