[package]
name = "goway-setup"
description = "Installer and provable uninstaller for goway (Windows client and host components)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "goway-setup"
path = "src/main.rs"

[dependencies]
anstream = "0.6"
anstyle = "1"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
dirs = "6"
goway-journal = { path = "../goway-journal" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
proptest = "1"
tempfile = "3"

# The workspace table forbids unsafe code; this crate needs exactly one audited
# call (the WM_SETTINGCHANGE broadcast), so it carries its own copy with `deny`.
[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
