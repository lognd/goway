[package]
name = "goway-journal"
description = "Write-ahead change journal whose replay provably inverts an install."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
serde_json = "1"
proptest = "1"
tempfile = "3"

[lints]
workspace = true
